name: Tests and static app deployment

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    env:
      AUDIT_SECRET_KEY: ci-test-only-${{ github.run_id }}-${{ matrix.python-version }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[api,test]"
      - name: Compile Python sources
        run: python -m compileall -q agents esas_palliative cli.py enrichment.py simulator.py
      - name: Run unit and API tests
        run: python -m pytest -q
      - name: Verify audit-chain signature and linkage
        run: |
          python -c "from agents.base import AuditTrail; t=AuditTrail(); t.log('ci','test','TEST',{'status':'ok'}); assert t.verify_integrity()"

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate browser scoring
        run: node --test web/esas-core.test.mjs
      - name: Check published page references
        run: |
          test -f web/index.html
          test -f web/esas-core.js
          grep -q 'type="module"' web/index.html

  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [python, browser]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
